name: Build ReadStep APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ReadStep project
        shell: bash
        run: |
          set -e

          echo "Extracting starter project..."

          mkdir -p extracted
          unzip -q ReadStep-GitHub-Starter.zip -d extracted

          echo "Searching for Android project..."

          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

          echo "Project files:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReadStep-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
