name: Build ReadStep APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ReadStep project
        shell: bash
        run: |
          set -e

          echo "Extracting ReadStep project..."

          rm -rf extracted
          mkdir -p extracted

          if [ ! -f "ReadStep-GitHub-Starter.zip" ]; then
            echo "ERROR: ReadStep-GitHub-Starter.zip not found!"
            exit 1
          fi

          unzip -q "ReadStep-GitHub-Starter.zip" -d extracted

          echo "Searching for Android project..."

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found!"
            find extracted -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

          echo "Checking project..."

          if [ ! -d "app" ]; then
            echo "ERROR: app directory was not found!"
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle file was not found!"
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle file was not found!"
            exit 1
          fi

          echo "Android project is ready."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Gradle
        run: |
          gradle --version

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

      - name: Make Gradle Wrapper executable
        run: |
          chmod +x ./gradlew

      - name: Verify Gradle Wrapper
        run: |
          ./gradlew --version

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Check APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find . -type f -name "*.apk" -print

          if ! find app/build/outputs/apk/debug -type f -name "*.apk" | grep -q .; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReadStep-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
